<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>note記事管理 — enadorry</title><link rel="stylesheet" href="/style.css"><style>main{max-width:760px;margin:8vh auto;padding:24px}h1{font-size:28px;margin:28px 0}p,label{font-size:14px;line-height:1.9;color:#bbb}select,textarea{display:block;width:100%;margin:12px 0 24px;background:#080808;color:#eee;border:1px solid #444;padding:14px;font:14px/1.9 sans-serif}textarea{min-height:45vh}button{background:#eee;color:#000;border:0;min-height:44px;padding:12px 24px;margin:20px 0}a{color:#eee;text-decoration:underline}input{accent-color:#f00}#status{min-height:48px}[hidden]{display:none!important}</style><script src="/note-admin.js" defer></script><link rel="stylesheet" href="/paper-admin.css"><link rel="stylesheet" href="/midnight.css"><link rel="stylesheet" href="/aurora.css"></head><body><main><a href="/admin.html">← 管理画面</a><h1>noteの記事をサイトに載せる<span style="color:#ff0000">.</span></h1><p>note.com/enadorryの新着記事を自動取得します。通常RSSは冒頭部分のみです。自分の記事の全文を下に貼り付けて保存すると、ホームページ内で全文を読めます。本文を空にするとRSSの表示へ戻ります。</p><p id="status" role="status" aria-live="polite">記事を読み込み中…</p><a id="login" hidden href="/signin-with-chatgpt?return_to=%2Fnote-admin.html" target="_top">ChatGPTでログイン</a><form id="editor" hidden><label for="article">記事を選ぶ</label><select id="article"></select><label for="body">ホームページに掲載する本文（改行を保持、最大10万文字）</label><textarea id="body" maxlength="100000"></textarea><label><input type="checkbox" id="published"> サイトに表示する</label><br><button id="save" type="submit">保存する</button></form><p><a href="/index.html#notes">掲載中の記事を見る ↗</a></p></main></body></html>
